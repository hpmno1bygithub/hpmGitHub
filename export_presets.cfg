[preset.0]
name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,data/maps/*.json,data/populations/*.json,assets/*.json,assets/pixel_sources/*.json"
exclude_filter="reference/*,docs/*,tools/*,tests/*,assets/editor_defaults/*,addons/*"
export_path="build/ios/PytoRPG.zip"

[preset.0.options]
architectures/arm64=true
application/app_store_team_id="UNSIGNED00"
application/bundle_identifier="com.example.pytorpg"
application/short_version="0.6.0"
application/version="1"
application/export_project_only=true
application/targeted_device_family=2
application/min_ios_version="14.0"
application/export_method_release=1
application/code_sign_identity_release=""
application/additional_plist_content="<key>UIFileSharingEnabled</key><true/><key>LSSupportsOpeningDocumentsInPlace</key><true/>"

